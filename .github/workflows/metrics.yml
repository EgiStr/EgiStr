name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"      # daily at 00:30 UTC (after snake)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Isometric commit calendar - the signature visual on the profile.
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Recent activity feed across issues, PRs and releases.
      # NOTE: plugin_habits is deliberately NOT used - it reads the public
      # events API, which renders "Unexpected error" for accounts whose
      # activity is mostly private. This covers the same ground and renders.
      - name: Recent activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.svg
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: issue, pr, release, wiki
          plugin_activity_visibility: all
          plugin_activity_load: 300
          plugin_activity_skipped: EgiStr/EgiStr

      # Language breakdown run over the repositories themselves.
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, jupyter notebook, scss
