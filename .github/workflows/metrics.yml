name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"      # daily at 00:30 UTC (after snake)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Isometric commit calendar - the signature visual on the profile.
      #
      # Only this plugin is used on purpose. `plugin_habits` and
      # `plugin_activity` were tried and removed: both read the public events
      # API, which renders "Unexpected error" on accounts whose activity is
      # mostly private. They produced an empty card rather than failing the
      # run, so the breakage was silent. Verify any new plugin's SVG actually
      # contains data before wiring it into the README.
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
