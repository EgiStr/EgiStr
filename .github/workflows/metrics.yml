name: Metrics

on:
  schedule:
    - cron: "30 0 * * *"      # daily at 00:30 UTC (after snake)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Isometric commit calendar - the signature visual on the profile.
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Coding habits: when the work actually happens + mildly interesting facts.
      - name: Coding habits and activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_habits: yes
          plugin_habits_charts_type: classic
          debug: yes
          use_prebuilt_image: no
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_padding: 0, 10%
          config_display: large

      # Language breakdown run over cloned repositories (more truthful than byte counting).
      - name: Languages (in-depth)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: programming, markup
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: yes
          plugin_languages_ignored: html, css, jupyter notebook, scss

