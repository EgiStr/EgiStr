name: Update README

on:
  schedule:
    - cron: "0 0 * * *"      # daily at 00:00 UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh the timestamp line
        env:
          TZ: Asia/Jakarta
        run: |
          set -euo pipefail

          STAMP="Updated $(date '+%d %b %Y, %H:%M %Z')"
          echo "stamp: $STAMP"

          python3 - "$STAMP" <<'PY'
          import pathlib, re, sys

          stamp = sys.argv[1]
          path = pathlib.Path("README.md")
          text = path.read_text(encoding="utf-8")

          # Matches BOTH the untouched marker and any previously written
          # timestamp, so every run is a straight replacement (idempotent -
          # timestamps never accumulate and a missed run self-heals).
          pattern = re.compile(r"<sub>(?:<!-- TIMESTAMP -->|Updated [^<]*)</sub>")

          if not pattern.search(text):
              sys.exit("::error::timestamp anchor not found in README.md")

          path.write_text(pattern.sub(f"<sub>{stamp}</sub>", text, count=1), encoding="utf-8")
          print(f"README timestamp -> {stamp}")
          PY

      - name: Commit and push
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet; then
            echo "README already up to date."
            exit 0
          fi

          git add README.md
          git commit -m "chore: refresh README timestamp"
          git push
