name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"          # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

# Only one generation at a time; a queued run supersedes an older one.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg?palette=github-light

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(snake): regenerate contribution grid [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### Snake regenerated :snake:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published to the \`output\` branch:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`github-contribution-grid-snake-dark.svg\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`github-contribution-grid-snake.svg\`" >> "$GITHUB_STEP_SUMMARY"
